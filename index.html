<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BrathBags — Private Luxury Drops</title>
<meta name="description" content="BrathBags. Accesorios y ropa premium en drops limitados.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="gate" class="gate">
  <div class="gate-media"></div>
  <div class="gate-shade"></div>
  <button class="gate-x" onclick="enterSite()">×</button>
  <div class="gate-logo"><img src="assets/brathbags_logo.png" alt="BrathBags"></div>
  <div class="gate-content">
    <p class="overline">PRIVATE DROP / 001</p>
    <h1>NEXT<br><i>RELEASE.</i></h1>
    <p class="gate-desc">Edición limitada. Acceso anticipado para miembros de BrathBags.</p>
    <div class="countdown" data-countdown>
      <div><b data-days>00</b><span>DÍAS</span></div><em>:</em>
      <div><b data-hours>00</b><span>HRS</span></div><em>:</em>
      <div><b data-minutes>00</b><span>MIN</span></div><em>:</em>
      <div><b data-seconds>00</b><span>SEG</span></div>
    </div>
    <div class="gate-actions">
      <button class="light-btn" onclick="enterSite()">ENTRAR</button>
      <button class="ghost-btn" onclick="enterAndLogin()">OBTENER ACCESO ANTICIPADO</button>
    </div>
    <small>01 OCT 2026 · 20:00 CDMX</small>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>
